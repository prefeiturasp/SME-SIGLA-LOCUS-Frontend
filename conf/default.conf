server {
    listen 80;
    server_name SERVER_NAME;

    # /locus/assets/x.js -> /assets/x.js (arquivos reais no root do nginx)
    # /locus/cadastro/... -> /cadastro/... -> SPA (index.html)
    location /locus/ {
        rewrite ^/locus/(.*)$ /$1 last;
    }

    location = /locus {
        return 301 /locus/;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri /index.html;
    }
}
